---
# cluster/.../envoy-gateway/ks.yaml (or your root apps/networking ks.yaml)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-envoy-gateway
  namespace: flux-system
spec:
  targetNamespace: networking
  path: ./cluster/apps/networking/envoy-gateway/app
  prune: true
  wait: true # Ensures the HelmRelease and CRDs are applied and ready
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-envoy-gateway-config
  namespace: flux-system
spec:
  targetNamespace: networking
  path: ./cluster/apps/networking/envoy-gateway/config # Put envoy.yaml + a kustomization.yaml here
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cluster-apps-envoy-gateway
  sourceRef:
    kind: GitRepository
    name: flux-system
